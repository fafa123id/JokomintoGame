services:
  app:
    image: ${IMAGE:-jokominto:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3005"
      DB_FILE: /data/game.db
      IMAGE_CACHE_DIR: /data/image-cache
      # nginx-proxy -> nginx -> app: trust every private hop so the real client IP is used.
      TRUST_PROXY: "loopback, linklocal, uniquelocal"
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-3005}:3005"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal
      - shared-network

  web:
    image: nginx:1-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VIRTUAL_HOST: ${DOMAIN:-localhost}
      LETSENCRYPT_HOST: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - shared-network

volumes:
  app-data:

networks:
  internal:
  shared-network:
    external: true
