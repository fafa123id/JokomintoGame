<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JokomintoGame - Virtual Pet</title>
    <!-- Tambahkan Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka+One:wght@400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'ui-sans-serif', 'system-ui'],
                        'game': ['Fredoka One', 'cursive'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
        }

        /* Mobile optimizations */
        @media (max-width: 640px) {
            .gradient-bg {
                background-attachment: scroll;
            }

            body {
                overflow-x: hidden;
            }

            /* Larger touch targets for mobile */
            button {
                min-height: 48px;
            }

            /* Better spacing for mobile */
            .space-y-4>*+* {
                margin-top: 1.25rem;
            }
        }

        .card-shadow {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .btn-hover {
            transition: all 0.3s ease;
        }

        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Prevent button hover on mobile */
        @media (max-width: 640px) {
            .btn-hover:hover {
                transform: none;
            }
        }

        .stat-bar {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Better readability */
        @media (max-width: 640px) {
            .leading-relaxed {
                line-height: 1.6;
            }
        }
    </style>
</head>

<body class="font-sans gradient-bg min-h-screen overflow-x-hidden">
    <div class="min-h-screen h-full flex flex-col">

        <!-- Status Bar - Diperbesar untuk Mobile -->
        <div class="stat-bar p-3 sm:p-4 mx-3 sm:mx-4 mt-3 sm:mt-4 rounded-2xl">
            <!-- Mobile: Grid 2x2, Desktop: Horizontal -->
            <div
                class="grid grid-cols-2 gap-2 sm:flex sm:flex-wrap sm:justify-center sm:gap-4 lg:space-x-6 lg:flex-nowrap lg:gap-0">
                <div class="flex items-center space-x-2 bg-white/25 px-3 py-2 sm:px-4 sm:py-2 rounded-full min-w-0">
                    <span class="text-lg sm:text-2xl">😊</span>
                    <div class="min-w-0">
                        <p class="text-white font-semibold text-sm sm:text-sm truncate">Mood</p>
                        <p class="text-white font-bold text-sm sm:text-base" id="mood"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 bg-white/25 px-3 py-2 sm:px-4 sm:py-2 rounded-full min-w-0">
                    <span class="text-lg sm:text-2xl">🛁</span>
                    <div class="min-w-0">
                        <p class="text-white font-semibold text-sm sm:text-sm truncate">Hygiene</p>
                        <p class="text-white font-bold text-sm sm:text-base" id="hygiene"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 bg-white/25 px-3 py-2 sm:px-4 sm:py-2 rounded-full min-w-0">
                    <span class="text-lg sm:text-2xl">🍎</span>
                    <div class="min-w-0">
                        <p class="text-white font-semibold text-sm sm:text-sm truncate">Hunger</p>
                        <p class="text-white font-bold text-sm sm:text-base" id="hunger"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 bg-white/25 px-3 py-2 sm:px-4 sm:py-2 rounded-full min-w-0">
                    <span class="text-lg sm:text-2xl">🪙</span>
                    <div class="min-w-0">
                        <p class="text-white font-semibold text-sm sm:text-sm truncate">Coin</p>
                        <p class="text-white font-bold text-sm sm:text-base" id="coin"></p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Message Container - Diperbaiki untuk Mobile -->
        <div id="message-container" class="flex justify-center items-center px-4 py-3 sm:p-4 hidden mt-2">
            <div
                class="bg-white/95 backdrop-blur-sm px-5 py-3 sm:px-6 sm:py-3 rounded-2xl card-shadow max-w-sm sm:max-w-md mx-auto">
                <h2 id="message" class="text-gray-800 font-semibold text-sm sm:text-base text-center leading-relaxed">
                </h2>
            </div>
        </div>
        <!-- Main Content - Container Diperbesar -->
        <div class="mainScreen justify-center items-center flex-1 flex flex-col px-4 py-3 sm:p-6">
            <!-- Main Menu - Lebih Luas -->
            <div id="optionButton" class="flex flex-col space-y-4 sm:space-y-4 w-full max-w-sm sm:max-w-md lg:max-w-lg">
                <div class="text-center mb-6 sm:mb-8">
                    <h1 class="font-game text-3xl sm:text-4xl text-white mb-2 animate-bounce-slow">🎮 JokomintoGame</h1>
                    <p class="text-white/80 text-base sm:text-lg">Take care of your virtual pet!</p>
                </div>
                <button
                    class="bg-gradient-to-r from-green-400 to-green-600 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover card-shadow"
                    onclick="GameMenu()">
                    <span class="text-2xl sm:text-2xl mr-2">🎯</span>Main Game
                </button>
                <button
                    class="bg-gradient-to-r from-blue-400 to-blue-600 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover card-shadow"
                    onclick="bath()">
                    <span class="text-2xl sm:text-2xl mr-2">🛁</span>Mandi
                </button>
                <button
                    class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover card-shadow"
                    onclick="feed()">
                    <span class="text-2xl sm:text-2xl mr-2">🍎</span>Makan
                </button>
            </div>

            <!-- Game Menu - Lebih Luas -->
            <div id="menuGame"
                class="flex flex-col space-y-4 sm:space-y-4 w-full max-w-sm sm:max-w-md lg:max-w-lg hidden">
                <div class="text-center mb-6 sm:mb-6">
                    <h1 class="font-game text-3xl sm:text-3xl text-white mb-2">🎮 Pilih Game</h1>
                </div>
                <button
                    class="bg-gradient-to-r from-purple-500 to-pink-500 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover card-shadow"
                    onclick="tebakKata()">
                    <span class="text-2xl sm:text-2xl mr-2">🔤</span>Tebak Kata
                </button>
                <button
                    class="bg-gradient-to-r from-red-500 to-red-600 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover card-shadow"
                    onclick="window.location='/index.html'">
                    <span class="text-2xl sm:text-2xl mr-2">🔙</span>Kembali
                </button>
            </div>

            <!-- Tebak Kata Game - Spacing Diperbaiki -->
            <div id="tebakKata"
                class="flex flex-col space-y-5 sm:space-y-6 w-full max-w-md sm:max-w-lg lg:max-w-xl hidden">
                <div class="bg-white/95 backdrop-blur-sm p-5 sm:p-6 rounded-3xl card-shadow">
                    <div class="text-center mb-5 sm:mb-6">
                        <h1 class="font-game text-2xl sm:text-3xl text-gray-800 mb-2">🔤 Game Tebak Kata</h1>
                        <p class="text-gray-600 text-sm sm:text-base leading-relaxed">Tebak kata berdasarkan petunjuk
                            yang diberikan!</p>
                    </div>

                    <!-- Timer - Lebih Besar -->
                    <div
                        class="bg-gradient-to-r from-red-400 to-red-600 text-white p-3 sm:p-3 rounded-2xl text-center mb-4 sm:mb-4">
                        <p class="font-bold text-lg sm:text-lg">⏰ Waktu: <span id="time" class="animate-pulse">5</span>
                            detik</p>
                    </div>

                    <!-- Word Display - Lebih Besar -->
                    <div class="bg-gray-100 p-4 sm:p-4 rounded-2xl text-center mb-5 sm:mb-6">
                        <p id="wordDisplay" class="text-2xl sm:text-2xl font-bold text-gray-800 tracking-widest">
                            Loading...</p>
                    </div>

                    <!-- Input Form - Spacing Diperbaiki -->
                    <form id="tebakKataForm" class="space-y-4 sm:space-y-4 mb-4">
                        <input type="text" id="inputTebakKata" placeholder="Masukkan kata..." required
                            class="w-full p-4 sm:p-4 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none text-lg sm:text-lg font-semibold text-center">
                        <button type="submit"
                            class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover">
                            <span class="text-xl sm:text-xl mr-2">✅</span>Submit Jawaban
                        </button>
                    </form>

                    <!-- Hint Button - Spacing Diperbaiki -->
                    <button onclick="revealHint()"
                        class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-white p-4 sm:p-4 rounded-2xl font-bold text-lg sm:text-lg btn-hover mb-4">
                        <span class="text-xl sm:text-xl mr-2">💡</span>Hint (-20 Coin)
                    </button>

                    <!-- Back Button - Spacing Diperbaiki -->
                    <button onclick="window.location='/index.html'"
                        class="w-full bg-gradient-to-r from-gray-500 to-gray-600 text-white p-3 sm:p-3 rounded-2xl font-bold btn-hover">
                        <span class="text-xl sm:text-xl mr-2">🔙</span>Kembali ke Menu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load hanya index.js dan main.js sebagai module -->
    <script src="index.js"></script>
    <script src="/src/components.js"></script>
    <script src="/src/condition.js"></script>
    <script src="/src/routing.js"></script>
    <script src="/src/Game/contextHandler.js"></script>
    <script src="/src/Game/tebakKata.js"></script>

</body>

</html>
